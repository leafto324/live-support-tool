name: Auto Update Live Events

on:
  schedule:
    - cron: '0 23 * * *' # 毎日日本時間 朝8時（UTC 23:00）に自動実行
  workflow_dispatch: # 手動で即時実行できるボタンを追加

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v3

      - name: Pythonのセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: スクレイピングプログラムの実行
        run: python scraper.py

      - name: 変更をGitHubに自動コミット＆保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: 最新ライブ情報の更新" && git push)
