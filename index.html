<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライブサポートツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white p-4 shadow-md mb-6">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">ライブサポートツール</h1>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 space-y-6">

        <!-- 1. 推しグループ選択・設定エリア（既存機能） -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
                <span>🎵</span> 推しグループ選択
            </h2>
            <div class="space-y-3">
                <select id="groupSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">グループを選択してください</option>
                    <option value="tokyo">東京駅</option>
                    <option value="calendar">カレンダー</option>
                </select>
            </div>
        </section>

        <!-- 2. グループ追加リクエストフォーム -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-2 flex items-center gap-2">
                <span>💡</span> 推しグループ追加リクエスト
            </h2>
            <p class="text-xs text-slate-500 mb-4">
                選択肢にないグループの追加をご希望の場合は、以下からリクエストを送信してください。
            </p>

            <div class="flex flex-col sm:flex-row gap-2">
                <input 
                    type="text" 
                    id="requestInput" 
                    placeholder="例: 新規グループ名" 
                    class="flex-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                >
                <button 
                    onclick="submitRequest()" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors whitespace-nowrap"
                >
                    リクエスト送信
                </button>
            </div>
            
            <p id="requestMsg" class="mt-3 text-xs text-center font-medium hidden"></p>
        </section>

    </main>

    <script>
        // 推しグループ追加リクエスト機能
        function submitRequest() {
            const input = document.getElementById('requestInput');
            const value = input.value.trim();

            if (!value) {
                alert('グループ名を入力してください。');
                return;
            }

            const gasUrl = "https://script.google.com/macros/s/AKfycbyTMJGRFka6NZq9xokH1KwCt74xkx5yoiW8KQmrcNny0CVohQp_723zYXNLIXliUMnDUA/exec";

            const msgElement = document.getElementById('requestMsg');
            msgElement.textContent = "送信中...";
            msgElement.className = "mt-3 text-xs text-center font-medium text-slate-500";
            msgElement.classList.remove('hidden');

            const formData = new URLSearchParams();
            formData.append("groupName", value);

            fetch(gasUrl, {
                method: "POST",
                mode: "no-cors",
                body: formData
            })
            .then(() => {
                msgElement.textContent = "リクエストを送信しました！確認後に反映されます。";
                msgElement.className = "mt-3 text-xs text-center font-medium text-emerald-600";
                input.value = '';
                setTimeout(() => {
                    msgElement.classList.add('hidden');
                }, 5000);
            })
            .catch(err => {
                alert('送信に失敗しました。');
                msgElement.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
