<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オタク向け遠征費＆参戦管理ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeColor: 'var(--theme-color)',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --theme-color: #ec4899; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- ヘッダー -->
    <header id="appHeader" class="text-white py-8 px-4 shadow-lg transition-all duration-300 relative bg-cover bg-center" style="background-color: var(--theme-color);">
        <div id="headerOverlay" class="absolute inset-0 bg-black/30 transition-all"></div>
        <div class="max-w-2xl mx-auto relative z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold drop-shadow-md">参戦・遠征費シミュレーター</h1>
                <p class="text-xs opacity-90 mt-1 drop-shadow">現場のチケット代・遠征費・持ち物を一括管理</p>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <div class="flex items-center gap-2">
                    <label class="cursor-pointer bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg text-xs font-bold backdrop-blur-sm transition flex items-center gap-1.5 shadow-sm">
                        <span>📷 推し画像に変更</span>
                        <input type="file" accept="image/*" onchange="changeHeaderImage(event)" class="hidden">
                    </label>
                    <button onclick="resetHeaderImage()" class="text-xs text-white/80 hover:text-white underline">標準に戻す</button>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="text-xs opacity-90">アクセント:</span>
                    <div class="flex gap-1 bg-white/20 p-1 rounded-lg backdrop-blur-sm">
                        <button onclick="changeColor('#ec4899')" class="w-5 h-5 rounded-full bg-pink-500 border-2 border-white" title="ピンク"></button>
                        <button onclick="changeColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500 border-2 border-white" title="青"></button>
                        <button onclick="changeColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500 border-2 border-white" title="赤"></button>
                        <button onclick="changeColor('#eab308')" class="w-5 h-5 rounded-full bg-yellow-500 border-2 border-white" title="黄色"></button>
                        <button onclick="changeColor('#a855f7')" class="w-5 h-5 rounded-full bg-purple-500 border-2 border-white" title="紫"></button>
                        <button onclick="changeColor('#22c55e')" class="w-5 h-5 rounded-full bg-green-500 border-2 border-white" title="緑"></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

        <!-- 0. 推しグループ選択 & スケジュール自動表示 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span class="w-2 h-5 bg-themeColor rounded-full transition-colors duration-300"></span>
                    最新スケジュール（ライブ・メディア）
                </h2>
                
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-500 whitespace-nowrap">推しを選択:</label>
                    <select id="groupSelect" onchange="onGroupChange()" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-pink-300">
                        <option value="">グループを読み込み中...</option>
                    </select>
                </div>
            </div>

            <!-- 出発地設定バー -->
            <div class="mb-4 p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center gap-2 text-xs">
                <span class="font-bold text-slate-600 whitespace-nowrap">🏠 あなたの出発地:</span>
                <input type="text" id="originInput" oninput="saveOrigin()" placeholder="例: 札幌駅 または 東京駅" class="flex-1 px-3 py-1.5 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-300">
            </div>

            <!-- スケジュール一覧表示欄 -->
            <div id="eventList" class="space-y-3 text-sm mb-6">
                <p class="text-slate-400 text-xs">日程情報を読み込み中...</p>
            </div>

            <!-- グループ追加リクエストフォーム -->
            <div class="border-t border-slate-100 pt-4">
                <details class="text-xs text-slate-500 cursor-pointer">
                    <summary class="font-bold text-themeColor hover:underline">自分の推しグループがない場合はこちら（リクエスト）</summary>
                    <div class="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                        <p class="text-slate-600">リストにないグループ名を入力して送信してください。管理者が確認後、順次追加されます。</p>
                        <div class="flex gap-2">
                            <input type="text" id="requestInput" class="flex-1 px-3 py-1.5 border rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="例: 乃木坂46">
                            <button onclick="submitRequest()" class="bg-themeColor text-white font-bold px-4 py-1.5 rounded-lg text-sm transition-colors hover:opacity-90">送信</button>
                        </div>
                        <p id="requestMsg" class="text-xs font-bold text-green-600 hidden">リクエストを送信しました！確認後に反映されます。</p>
                    </div>
                </details>
            </div>
        </section>

        <!-- 1. 遠征・参戦予算計算 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="w-2 h-5 bg-themeColor rounded-full transition-colors duration-300"></span>
                遠征・現場費用シミュレーター
            </h2>

            <div class="space-y-4 text-sm">
                <div>
                    <label class="block text-slate-600 mb-1 font-medium">チケット代（手数料込）</label>
                    <input type="number" id="ticketCost" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="10000" oninput="calculateTotal()">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">交通費（往復）</label>
                        <input type="number" id="transportCost" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="25000" oninput="calculateTotal()">
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">宿泊費</label>
                        <input type="number" id="hotelCost" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="8000" oninput="calculateTotal()">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">グッズ購入予定額</label>
                        <input type="number" id="goodsCost" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="15000" oninput="calculateTotal()">
                    </div>
                    <div>
                        <label class="block text-slate-600 mb-1 font-medium">その他（参戦服・美容等）</label>
                        <input type="number" id="otherCost" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-300" placeholder="10000" oninput="calculateTotal()">
                    </div>
                </div>

                <div class="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-100 flex justify-between items-center">
                    <span class="font-bold text-slate-700">遠征トータル想定費用</span>
                    <span id="totalDisplay" class="text-2xl font-black text-themeColor transition-colors duration-300">¥0</span>
                </div>
            </div>
        </section>

        <!-- 2. 参戦持ち物チェックリスト -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-1 flex items-center gap-2">
                <span class="w-2 h-5 bg-themeColor rounded-full transition-colors duration-300"></span>
                現場・遠征 持ち物チェックリスト
            </h2>
            <p class="text-xs text-slate-500 mb-4">チェック状態は自動保存されるので、次回も続きから使えます。</p>

            <div id="checklist" class="space-y-2 text-sm"></div>
        </section>

    </main>

    <script>
        const defaultItems = [
            "デジチケ表示用スマホ", "身分証明書", "ファンクラブ会員証",
            "ペンライト（予備電池含む）", "アクスタ・ぬい", "うちわ・カンペうちわ",
            "モバイルバッテリー", "双眼鏡", "双眼鏡用防振電池", "折りたたみ傘"
        ];

        let allEvents = [];

        window.onload = function() {
            loadSavedData();
            calculateTotal();
            fetchEvents();
        };

        function changeHeaderImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                applyHeaderImage(imageUrl);
                localStorage.setItem('userHeaderImg', imageUrl);
            };
            reader.readAsDataURL(file);
        }

        function applyHeaderImage(url) {
            const header = document.getElementById('appHeader');
            header.style.backgroundImage = `url('${url}')`;
            document.getElementById('headerOverlay').className = "absolute inset-0 bg-black/50 transition-all";
        }

        function resetHeaderImage() {
            const header = document.getElementById('appHeader');
            header.style.backgroundImage = 'none';
            document.getElementById('headerOverlay').className = "absolute inset-0 bg-black/30 transition-all";
            localStorage.removeItem('userHeaderImg');
        }

        function saveOrigin() {
            const origin = document.getElementById('originInput').value;
            localStorage.setItem('userOrigin', origin);
            renderEvents();
        }

        function saveEventMemo(eventId) {
            const memoText = document.getElementById(`memo-${eventId}`).value;
            const savedMemos = JSON.parse(localStorage.getItem('eventMemos') || '{}');
            savedMemos[eventId] = memoText;
            localStorage.setItem('eventMemos', JSON.stringify(savedMemos));
        }

        function saveEventShiori(eventId) {
            const shioriText = document.getElementById(`shiori-${eventId}`).value;
            const savedShioris = JSON.parse(localStorage.getItem('eventShioris') || '{}');
            savedShioris[eventId] = shioriText;
            localStorage.setItem('eventShioris', JSON.stringify(savedShioris));
        }

        function fetchEvents() {
            fetch('./events.json')
                .then(res => res.json())
                .then(data => {
                    allEvents = data;
                    setupGroupDropdown();
                })
                .catch(err => {
                    document.getElementById('eventList').innerHTML = '<p class="text-xs text-slate-400">最新スケジュール情報を準備中です。</p>';
                });
        }

        function setupGroupDropdown() {
            const select = document.getElementById('groupSelect');
            select.innerHTML = '';

            const groups = [...new Set(allEvents.map(item => item.group))];
            
            groups.forEach(groupName => {
                const opt = document.createElement('option');
                opt.value = groupName;
                opt.textContent = groupName;
                select.appendChild(opt);
            });

            const savedGroup = localStorage.getItem('selectedGroup');
            if (savedGroup && groups.includes(savedGroup)) {
                select.value = savedGroup;
            }

            renderEvents();
        }

        function onGroupChange() {
            const selected = document.getElementById('groupSelect').value;
            localStorage.setItem('selectedGroup', selected);
            renderEvents();
        }

        function createGoogleCalendarUrl(title, dateStr, openTime, startTime) {
            const formattedDate = dateStr.replace(/-/g, '');
            const nextDateObj = new Date(dateStr);
            nextDateObj.setDate(nextDateObj.getDate() + 1);
            const formattedNextDate = nextDateObj.toISOString().slice(0, 10).replace(/-/g, '');

            const baseUrl = "https://calendar.google.com/calendar/render?action=TEMPLATE";
            const textParam = `&text=${encodeURIComponent(title)}`;
            const datesParam = `&dates=${formattedDate}/${formattedNextDate}`;
            const detailsParam = `&details=${encodeURIComponent(`時間: ${openTime} /${startTime}\n（参戦・遠征費シミュレーターより登録）`)}`;

            return `${baseUrl}${textParam}${datesParam}${detailsParam}`;
        }

        function createMapUrl(venue, category) {
            if (category === 'メディア' || venue.includes('配信') || venue.includes('テレビ') || venue.includes('ラジオ')) {
                return `https://www.google.com/search?q=${encodeURIComponent(venue)}`;
            }
            const origin = document.getElementById('originInput').value.trim();
            if (!origin) {
                return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venue)}`;
            }
            return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(venue)}&travelmode=transit`;
        }

        function renderEvents() {
            const container = document.getElementById('eventList');
            const selectedGroup = document.getElementById('groupSelect').value;
            const savedMemos = JSON.parse(localStorage.getItem('eventMemos') || '{}');
            const savedShioris = JSON.parse(localStorage.getItem('eventShioris') || '{}');

            if (!selectedGroup) {
                container.innerHTML = '<p class="text-xs text-slate-400">グループを選択してください。</p>';
                return;
            }

            const filtered = allEvents.filter(item => item.group === selectedGroup);

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400">「${selectedGroup}」の該当スケジュールはありません。</p>`;
                return;
            }

            container.innerHTML = '';
            filtered.forEach((item, idx) => {
                const eventId = `${item.group}-${item.date}-${idx}`;
                const memoValue = savedMemos[eventId] || '';
                const defaultShiori = "09:00 出発\n12:00 現地到着＆ホテル預け\n13:00 グッズ物販\n16:00 開場\n18:00 開演";
                const shioriValue = savedShioris[eventId] !== undefined ? savedShioris[eventId] : defaultShiori;

                const calUrl = createGoogleCalendarUrl(`【${item.group}】${item.title}`, item.date, item.open_time || '', item.start_time || '');
                const mapUrl = createMapUrl(item.venue, item.category);
                
                const isLive = item.category === 'ライブ';
                const badgeClass = isLive ? "bg-pink-100 text-pink-600" : "bg-sky-100 text-sky-700";
                const btnClass = isLive ? "bg-pink-50 hover:bg-pink-100 text-pink-600 border-pink-200" : "bg-sky-50 hover:bg-sky-100 text-sky-700 border-sky-200";
                const btnText = isLive ? "🚗 移動時間" : "📺 放送情報";

                const div = document.createElement('div');
                div.className = "p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3";
                div.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-200/60 pb-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-extrabold text-slate-500">${item.date}</span>
                                <span class="text-xs px-2 py-0.5 rounded-full font-bold ${badgeClass}">${item.category || 'イベント'}</span>
                                <span class="text-xs px-2 py-0.5 rounded-full font-bold bg-slate-200 text-slate-700">${item.status}</span>
                            </div>
                            <span class="font-bold text-slate-800 text-base block mt-0.5">${item.title}</span>
                        </div>
                        <div class="flex items-center gap-2 self-end sm:self-center">
                            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="text-xs ${btnClass} font-bold px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 border shadow-sm">
                                <span>${btnText}</span>
                            </a>
                            <a href="${calUrl}" target="_blank" rel="noopener noreferrer" class="text-xs bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm">
                                <span>🗓️ カレンダー</span>
                            </a>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-600">
                        <div>📍 場所/媒体: <span class="font-bold text-slate-800">${item.venue}</span></div>
                        <div>⏰ 時間: <span class="font-bold text-slate-800">${item.start_time || item.open_time || '未定'}</span></div>
                    </div>

                    ${item.notice ? `<div class="p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-xs font-bold flex items-center gap-1.5">${item.notice}</div>` : ''}

                    <div class="pt-1">
                        <input type="text" id="memo-${eventId}" value="${memoValue}" oninput="saveEventMemo('${eventId}')" placeholder="📝 メモ（ホテル予約番号、発券番号、連番相手など）" class="w-full text-xs px-3 py-1.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-pink-400 placeholder-slate-400">
                    </div>

                    ${isLive ? `
                    <div class="pt-1">
                        <details class="text-xs">
                            <summary class="font-bold text-slate-600 cursor-pointer hover:text-themeColor flex items-center gap-1">
                                <span>🚩 当日のタイムスケジュール（しおり）を開く</span>
                            </summary>
                            <div class="mt-2 p-2.5 bg-white rounded-lg border border-slate-200 space-y-1">
                                <p class="text-[10px] text-slate-400">当日の動きをメモしておけます（編集内容は自動保存）</p>
                                <textarea id="shiori-${eventId}" oninput="saveEventShiori('${eventId}')" rows="4" class="w-full text-xs p-2 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-pink-400 text-slate-700 leading-relaxed">${shioriValue}</textarea>
                            </div>
                        </details>
                    </div>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function submitRequest() {
            const input = document.getElementById('requestInput');
            const value = input.value.trim();

            if (!value) {
                alert('グループ名を入力してください。');
                return;
            }

            const repoUrl = "https://github.com/leafto324/live-support-tool/issues/new";
            const issueTitle = encodeURIComponent(`【グループ追加リクエスト】${value}`);
            const issueBody = encodeURIComponent(`新規グループ追加のリクエストがありました。\n\n■グループ名: ${value}`);
            
            window.open(`${repoUrl}?title=${issueTitle}&body=${issueBody}`, '_blank');

            document.getElementById('requestMsg').classList.remove('hidden');
            input.value = '';
        }

        function changeColor(colorHex) {
            document.documentElement.style.setProperty('--theme-color', colorHex);
            localStorage.setItem('userThemeColor', colorHex);
        }

        function calculateTotal() {
            const ticket = Number(document.getElementById('ticketCost').value) || 0;
            const transport = Number(document.getElementById('transportCost').value) || 0;
            const hotel = Number(document.getElementById('hotelCost').value) || 0;
            const goods = Number(document.getElementById('goodsCost').value) || 0;
            const other = Number(document.getElementById('otherCost').value) || 0;

            const total = ticket + transport + hotel + goods + other;
            document.getElementById('totalDisplay').innerText = `¥${total.toLocaleString()}`;

            const costs = { ticket, transport, hotel, goods, other };
            localStorage.setItem('userCosts', JSON.stringify(costs));
        }

        function loadSavedData() {
            const savedOrigin = localStorage.getItem('userOrigin');
            if (savedOrigin) {
                document.getElementById('originInput').value = savedOrigin;
            }

            const savedHeaderImg = localStorage.getItem('userHeaderImg');
            if (savedHeaderImg) {
                applyHeaderImage(savedHeaderImg);
            }

            const savedColor = localStorage.getItem('userThemeColor');
            if (savedColor) changeColor(savedColor);

            const savedCosts = JSON.parse(localStorage.getItem('userCosts') || '{}');
            if (savedCosts.ticket) document.getElementById('ticketCost').value = savedCosts.ticket;
            if (savedCosts.transport) document.getElementById('transportCost').value = savedCosts.transport;
            if (savedCosts.hotel) document.getElementById('hotelCost').value = savedCosts.hotel;
            if (savedCosts.goods) document.getElementById('goodsCost').value = savedCosts.goods;
            if (savedCosts.other) document.getElementById('otherCost').value = savedCosts.other;

            const savedChecks = JSON.parse(localStorage.getItem('userChecks') || '{}');
            const checklistContainer = document.getElementById('checklist');
            
            defaultItems.forEach((item, index) => {
                const isChecked = savedChecks[index] || false;
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer";
                div.innerHTML = `
                    <input type="checkbox" id="item-${index}" ${isChecked ? 'checked' : ''} onchange="saveCheck(${index})" class="w-4 h-4 accent-pink-500 rounded cursor-pointer">
                    <label for="item-${index}" class="cursor-pointer flex-1 text-slate-700">${item}</label>
                `;
                checklistContainer.appendChild(div);
            });
        }

        function saveCheck(index) {
            const savedChecks = JSON.parse(localStorage.getItem('userChecks') || '{}');
            savedChecks[index] = document.getElementById(`item-${index}`).checked;
            localStorage.setItem('userChecks', JSON.stringify(savedChecks));
        }
    </script>
</body>
</html>
